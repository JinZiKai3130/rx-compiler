# Kotlin 2.1.0 (used by kotlin-language-server) cannot parse the four-part
# version string of the JRE 25 bundled with the Java extension ("25.0.4.1"),
# so pin the Gradle daemon to the system JDK 21.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
